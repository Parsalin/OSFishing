# LIVE vhost as certbot rewrote it (pulled from the server 2026-09-14).
# Reference only — osfishing.flamesfall.net.conf is the pre-TLS source that
# INSTALL.sh deploys; certbot adds the 443 block and the 80->443 redirect.
# Do not hand-edit this file expecting it to deploy.

server {
    server_name osfishing.flamesfall.net;
    root /var/www/osfishing/web/public;

    # The portal is a static SPA (index.html) that calls /api.
    # index.php is listed second so a PHP entry point can be added later
    # without touching this file.
    index index.html index.php;

    access_log /var/log/nginx/osfishing.flamesfall.net.access.log;
    error_log  /var/log/nginx/osfishing.flamesfall.net.error.log;

    client_max_body_size 8M;

    # ── Defence in depth ──────────────────────────────────────
    # config.php, includes/ and migrations/ live OUTSIDE this docroot
    # (one level up, in /var/www/osfishing/web/), so they are already
    # unreachable. These rules are a second line of defence in case
    # something is ever added to public/ by mistake.
    location ~ ^/(includes|migrations|vendor|storage)/ { deny all; return 404; }
    location ~ \.(sql|md|sh|ini|log|bak|yml|yaml|lock|dist)$ { deny all; return 404; }
    location ~ /\.  { deny all; return 404; }

    include /etc/nginx/snippets/osfishing-limits.conf;

    location ~ \.php$ {
        # snippets/fastcgi-php.conf already does "try_files $fastcgi_script_name =404",
        # which refuses to hand FPM a script that does not exist. Do not add a
        # second try_files here — nginx rejects the duplicate, and the snippet's
        # version is the correct one anyway (it tests the path after
        # fastcgi_split_path_info strips PATH_INFO, so real PATH_INFO requests
        # still work).
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-osfishing.sock;
        fastcgi_read_timeout 30;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/osfishing.flamesfall.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/osfishing.flamesfall.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = osfishing.flamesfall.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name osfishing.flamesfall.net;
    return 404; # managed by Certbot


}