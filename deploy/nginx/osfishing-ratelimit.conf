# OSFishing rate-limit zone. http context: installed as
# /etc/nginx/conf.d/osfishing-ratelimit.conf by install-snippet.sh
# (limit_req_zone is not allowed inside a server block, so it can't live in
# the routing snippet). The zone is used in osfishing-limits.conf.
#
# Per client address. Every HUD in one region shares its sim's address, so
# this is set for a busy region, not for one person: 20 requests a second
# sustained, bursts to 80. A single abuser hammering /api or the login form
# still hits it quickly. Logins are also throttled in the app (Throttle).
limit_req_zone $binary_remote_addr zone=osfishing_req:10m rate=20r/s;
