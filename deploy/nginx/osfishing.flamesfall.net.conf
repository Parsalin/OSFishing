server {
    listen 80;
    listen [::]:80;
    server_name osfishing.flamesfall.net;
    root /var/www/osfishing/web/public;

    # The portal is a static SPA (index.html) that calls /api.
    # index.php is listed second so a PHP entry point can be added later
    # without touching this file.
    index index.html index.php;

    access_log /var/log/nginx/osfishing.flamesfall.net.access.log;
    error_log  /var/log/nginx/osfishing.flamesfall.net.error.log;

    client_max_body_size 8M;

    # ── Defence in depth ──────────────────────────────────────
    # config.php, includes/ and migrations/ live OUTSIDE this docroot
    # (one level up, in /var/www/osfishing/web/), so they are already
    # unreachable. These rules are a second line of defence in case
    # something is ever added to public/ by mistake.
    location ~ ^/(includes|migrations|vendor|storage)/ { deny all; return 404; }
    location ~ \.(sql|md|sh|ini|log|bak|yml|yaml|lock|dist)$ { deny all; return 404; }
    location ~ /\.  { deny all; return 404; }

    include /etc/nginx/snippets/osfishing-limits.conf;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-osfishing.sock;
        fastcgi_read_timeout 30;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
