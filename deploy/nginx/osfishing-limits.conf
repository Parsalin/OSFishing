# OSFishing routing, rate limit and security headers.
# Replaces the repo's old web/.htaccess, which nginx never reads.
# Included in the vhost's server block (installed by install-snippet.sh).

# ── Rate limit (audit item 49) ───────────────────────────────
# Server level, not inside "location /api": that location only rewrites to
# /api/index.php, and the request is then handled by the .php location, so
# a limit placed there would never run. The zone is defined in
# osfishing-ratelimit.conf (http context).
limit_req zone=osfishing_req burst=80 nodelay;
limit_req_status 429;

# ── Security headers (audit item 49) ─────────────────────────
# "always" so error replies carry them too. These apply because no location
# in the vhost sets add_header of its own (one that did would drop these).
# No full CSP yet: the portal and admin panel use inline scripts.
# Nothing frames this site (the HUD panel loads pages top-level), so
# framing is refused outright: no clickjacking of the admin panel.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
# HUD panel links carry a login signature in the query string (audit 43):
# never hand the full URL to another site.
add_header Referrer-Policy "same-origin" always;

# /api and /api/<anything> -> the single-entry API router.
# The HUD signs requests against these URLs, so both forms must work.
#
# These MUST NOT use the "^~" prefix modifier. "^~" tells nginx to stop
# evaluating regex locations once the prefix matches, which skips the
# "location ~ \.php$" block in the vhost — nginx then serves api/index.php
# as a raw file download instead of executing it, leaking the source and
# 405-ing every POST. Plain prefix locations still lose to regex locations,
# which is exactly what we want here.
#
# "rewrite ... last" rather than "try_files $uri ...": try_files would serve
# any file that happens to exist at the request path verbatim, so a .php file
# under /api would again be handed over as text rather than run.
location /api {
    rewrite ^/api(?:/.*)?$ /api/index.php last;
}

# Extensionless /pair -> pair.php. The HUD builds auto-pair links as
# /pair?uuid=X&code=Y, so this must resolve.
location = /pair {
    rewrite ^ /pair.php last;
}

location / {
    try_files $uri $uri/ =404;
}
