# OSFishing routing.
# Replaces the repo's old web/.htaccess, which nginx never reads.
# Kept in a separate snippet so rate limiting can be added later
# without rewriting the vhost.

# /api and /api/<anything> -> the single-entry API router.
# The HUD signs requests against these URLs, so both forms must work.
#
# These MUST NOT use the "^~" prefix modifier. "^~" tells nginx to stop
# evaluating regex locations once the prefix matches, which skips the
# "location ~ \.php$" block in the vhost — nginx then serves api/index.php
# as a raw file download instead of executing it, leaking the source and
# 405-ing every POST. Plain prefix locations still lose to regex locations,
# which is exactly what we want here.
#
# "rewrite ... last" rather than "try_files $uri ...": try_files would serve
# any file that happens to exist at the request path verbatim, so a .php file
# under /api would again be handed over as text rather than run.
location /api {
    rewrite ^/api(?:/.*)?$ /api/index.php last;
}

# Extensionless /setup -> setup.php (was a RewriteRule).
location = /setup {
    rewrite ^ /setup.php last;
}

# Extensionless /pair -> pair.php. The HUD builds auto-pair links as
# /pair?uuid=X&code=Y, so this must resolve.
location = /pair {
    rewrite ^ /pair.php last;
}

location / {
    try_files $uri $uri/ =404;
}
